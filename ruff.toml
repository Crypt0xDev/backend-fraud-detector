[lint]
# Además de las reglas por defecto, bugbear: detecta errores comunes, como usar
# una lista mutable como valor por defecto de un parámetro
extend-select = ["B"]

[lint.flake8-bugbear]
# Las dependencias de FastAPI van como valor por defecto a propósito:
# `db: Session = Depends(get_db)` y `Depends(require_permission("lotes", "ver"))`
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Form",
    "app.auth.auth_dependency.require_permission",
]
